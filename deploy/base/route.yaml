apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: pcbbq-web
  labels:
    app: pcbbq-web
  annotations:
    haproxy.router.openshift.io/disable_cookies: "true"
spec:
  # Any FQDN is allowed here regardless of the cluster's ingress wildcard domain.
  # Before DNS cutover, test against the apps-wildcard instead, e.g.
  #   pcbbq-web-pcbbq.apps.<cluster-domain>
  host: pinecoastbbq.com
  to:
    kind: Service
    name: pcbbq-web
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
    # The Porkbun cert (spec.tls.certificate / key / caCertificate) is patched in
    # out-of-band so the private key never enters git; Argo ignores those fields
    # (see deploy/argocd/application.yaml -> ignoreDifferences) and deploy/README.md.
    # This cluster does not have RouteExternalCertificate enabled, so a TLS Secret
    # reference is not an option here.
  wildcardPolicy: None
