apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: pcbbq-web
spec:
  source:
    type: Git
    git:
      uri: https://github.com/Kriegersan/pcbbq-web-prod.git
      ref: main
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    # Push straight to the integrated registry path. The registry auto-creates
    # the pcbbq-web ImageStream + :latest tag on push, which still drives the
    # Deployment's image trigger. (Avoids a build-controller ImageStream-output
    # resolution quirk seen right after the registry was enabled on this cluster.)
    to:
      kind: DockerImage
      name: image-registry.openshift-image-registry.svc:5000/pcbbq/pcbbq-web:latest
  runPolicy: Serial
  triggers:
    - type: ConfigChange
    # GitHub push trigger. The referenced secret is created out-of-band (it is a
    # secret, so not committed) — see deploy/README.md. Until the GitHub webhook
    # is wired, run:  oc -n <ns> start-build pcbbq-web --follow
    - type: GitHub
      github:
        secretReference:
          name: pcbbq-web-webhook
