apiVersion: apps/v1
kind: Deployment
metadata:
  name: pcbbq-web
  labels:
    app: pcbbq-web
  annotations:
    # Roll the Deployment whenever pcbbq-web:latest is rebuilt. OpenShift rewrites
    # the container image to a pinned digest; Argo is told to ignore that field
    # (see deploy/argocd/application.yaml -> ignoreDifferences).
    image.openshift.io/triggers: |
      [{"from":{"kind":"ImageStreamTag","name":"pcbbq-web:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"web\")].image"}]
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pcbbq-web
  template:
    metadata:
      labels:
        app: pcbbq-web
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: pcbbq-web
                topologyKey: kubernetes.io/hostname
      containers:
        - name: web
          image: pcbbq-web:latest
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
