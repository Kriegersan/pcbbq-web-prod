apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pcbbq-web
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/Kriegersan/pcbbq-web-prod.git
    targetRevision: main
    path: deploy/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: pcbbq
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    # OpenShift's image trigger rewrites the container image to a pinned digest.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/image
    # The Porkbun cert is patched into the Route out-of-band (keeps the key out
    # of git). RouteExternalCertificate is not enabled on this cluster.
    - group: route.openshift.io
      kind: Route
      jsonPointers:
        - /spec/tls/certificate
        - /spec/tls/key
        - /spec/tls/caCertificate
